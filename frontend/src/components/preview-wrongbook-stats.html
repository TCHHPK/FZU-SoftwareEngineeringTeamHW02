<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>错题本统计区 · 组件预览（吴雅晴）</title>
<style>
  :root {
    --c-surface: #ffffff; --c-text: #253957; --c-text-weak: #8390a3;
    --c-border: #d6e3f0; --radius-md: 10px;
    --shadow-sm: 0 1px 2px rgba(36, 66, 105, .06);
  }
  body {
    margin: 0; padding: 24px;
    background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e2d1c3, #d4e4f7);
    font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--c-text);
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .hint { margin: 0 0 14px; font-size: 13px; color: #606266; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat-card {
    position: relative; display: flex; flex-direction: column; gap: 6px;
    min-height: 84px; padding: 12px 16px;
    border: 1px solid var(--c-border); border-radius: var(--radius-md);
    background: var(--c-surface); box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .stat-card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tone); }
  .tone-primary { --tone: #409eff; }
  .tone-danger { --tone: #f56c6c; }
  .tone-warning { --tone: #e6a23c; }
  .tone-success { --tone: #67c23a; }
  .stat-label { font-size: 12px; color: var(--c-text-weak); letter-spacing: .2px; }
  .stat-value { display: flex; align-items: baseline; gap: 4px; line-height: 1.1; }
  .num { font-size: 26px; font-weight: 600; color: var(--c-text); font-variant-numeric: tabular-nums; }
  .unit { font-size: 12px; color: var(--c-text-weak); }
  .stat-hint { font-size: 11px; color: #9aa5b5; }

  .weak-chart {
    margin: 0; padding: 12px 16px;
    border: 1px solid var(--c-border); border-radius: var(--radius-md);
    background: var(--c-surface); box-shadow: var(--shadow-sm);
  }
  .chart-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .chart-head .title { font-size: 13px; font-weight: 600; }
  .chart-head .sub { font-size: 11px; color: var(--c-text-weak); }
  .chart-svg { display: block; width: 100%; max-width: 720px; height: auto; overflow: visible; }
  .track { fill: rgba(180, 196, 214, .18); }
  .label { font-size: 11px; fill: #3a4a60; }
  .value { font-size: 10px; fill: var(--c-text-weak); font-variant-numeric: tabular-nums; }
  .bar.tone-danger { fill: #f56c6c; }
  .bar.tone-warning { fill: #e6a23c; }
  .bar.tone-info { fill: #409eff; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--c-text-weak); }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .dot.tone-danger { background: #f56c6c; }
  .dot.tone-warning { background: #e6a23c; }
  .dot.tone-info { background: #409eff; }
</style>
</head>
<body>
<div class="wrap">
  <h2>错题本</h2>
  <p class="hint">按知识点聚合，错得越多越靠前；重做连对 2 次自动标记「已掌握」。</p>

  <div class="stats-grid">
    <div class="stat-card tone-primary">
      <div class="stat-label">错题总数</div>
      <div class="stat-value"><span class="num">23</span><span class="unit">题</span></div>
      <div class="stat-hint">覆盖 6 个知识点</div>
    </div>
    <div class="stat-card tone-danger">
      <div class="stat-label">未掌握</div>
      <div class="stat-value"><span class="num">15</span><span class="unit">题</span></div>
      <div class="stat-hint">连对 2 次自动转已掌握</div>
    </div>
    <div class="stat-card tone-success">
      <div class="stat-label">已掌握</div>
      <div class="stat-value"><span class="num">8</span><span class="unit">题</span></div>
      <div class="stat-hint">掌握率 35%</div>
    </div>
    <div class="stat-card tone-warning">
      <div class="stat-label">薄弱知识点</div>
      <div class="stat-value"><span class="num">6</span><span class="unit">个</span></div>
      <div class="stat-hint">错 ≥3 次的有 3 个</div>
    </div>
  </div>

  <figure class="weak-chart">
    <figcaption class="chart-head">
      <span class="title">薄弱知识点</span>
      <span class="sub">按错题次数排序</span>
    </figcaption>
    <svg class="chart-svg" viewBox="0 0 600 150" role="img" aria-label="薄弱知识点条形图"
         preserveAspectRatio="xMinYMin meet">
      <g transform="translate(0 0)">
        <rect x="132" y="4" width="428" height="16" rx="4" class="track"/>
        <text x="0" y="16" class="label">开闭原则</text>
        <rect x="132" y="4" width="428" height="16" rx="4" class="bar tone-danger"/>
        <text x="568" y="16" class="value">5</text>
      </g>
      <g transform="translate(0 24)">
        <rect x="132" y="4" width="428" height="16" rx="4" class="track"/>
        <text x="0" y="16" class="label">依赖倒置原则</text>
        <rect x="132" y="4" width="342" height="16" rx="4" class="bar tone-danger"/>
        <text x="568" y="16" class="value">4</text>
      </g>
      <g transform="translate(0 48)">
        <rect x="132" y="4" width="428" height="16" rx="4" class="track"/>
        <text x="0" y="16" class="label">单一职责原则</text>
        <rect x="132" y="4" width="257" height="16" rx="4" class="bar tone-danger"/>
        <text x="568" y="16" class="value">3</text>
      </g>
      <g transform="translate(0 72)">
        <rect x="132" y="4" width="428" height="16" rx="4" class="track"/>
        <text x="0" y="16" class="label">里氏替换原则</text>
        <rect x="132" y="4" width="171" height="16" rx="4" class="bar tone-warning"/>
        <text x="568" y="16" class="value">2</text>
      </g>
      <g transform="translate(0 96)">
        <rect x="132" y="4" width="428" height="16" rx="4" class="track"/>
        <text x="0" y="16" class="label">接口隔离原则</text>
        <rect x="132" y="4" width="86" height="16" rx="4" class="bar tone-info"/>
        <text x="568" y="16" class="value">1</text>
      </g>
      <g transform="translate(0 120)">
        <rect x="132" y="4" width="428" height="16" rx="4" class="track"/>
        <text x="0" y="16" class="label">合成复用原则</text>
        <rect x="132" y="4" width="86" height="16" rx="4" class="bar tone-info"/>
        <text x="568" y="16" class="value">1</text>
      </g>
    </svg>
    <div class="legend">
      <span class="legend-item"><i class="dot tone-danger"></i>高（≥3 次）</span>
      <span class="legend-item"><i class="dot tone-warning"></i>中（2 次）</span>
      <span class="legend-item"><i class="dot tone-info"></i>低（1 次）</span>
    </div>
  </figure>
</div>
</body>
</html>
